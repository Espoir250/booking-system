<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediBook | Patient Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="patient-dashboard">
  <header class="site-header compact">
    <a class="brand" href="index.html">MediBook</a>
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="doctors.html">Find Doctors</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Switch Account</a>
    </nav>
  </header>

  <main class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <h2>Patient Panel</h2>
      <a href="doctors.html">Book Appointment</a>
      <a href="patient-dashboard.html">My Appointments</a>
      <a href="register.html">Add Account</a>
    </aside>
    <section class="dashboard-main">
      <div class="dashboard-top">
        <div>
          <span class="eyebrow">Appointments</span>
          <h1>Your care schedule</h1>
        </div>
        <div class="stats-inline">
          <article><strong id="patient-upcoming-count">0</strong><span>Upcoming</span></article>
          <article><strong id="patient-cancelled-count">0</strong><span>Cancelled</span></article>
        </div>
      </div>
      <div id="patient-appointments" class="table-card"></div>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
